name: CI - Test & Coverage

on:
  push:
    branches: [ Main, feature-1 ]
  pull_request:
    branches: [ Main, feature-1 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Show Java version
      run: java -version

    - name: Build & test (with JaCoCo)
      run: mvn -B -DskipTests=false clean test

    - name: Upload JaCoCo report artifact
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco

    - name: Generate coverage-report.md from JaCoCo XML
      if: always()
      run: |
        set -euo pipefail
        XML=target/site/jacoco/jacoco.xml
        OUT=coverage-report.md
        if [ ! -f "$XML" ]; then
          echo "JaCoCo XML not found at $XML" >&2
          exit 0
        fi
        python3 - << 'PY'
import xml.etree.ElementTree as ET
from pathlib import Path
root = ET.parse('target/site/jacoco/jacoco.xml').getroot()
lines = []
lines.append('# Test Coverage Report')
lines.append('')
lines.append('Per-file line coverage (generated by CI):')
lines.append('')
lines.append('| File | Lines Covered | Lines Missed | Coverage % |')
lines.append('|---|---:|---:|---:|')
for pkg in root.findall('package'):
    pkgname = pkg.get('name')
    for src in pkg.findall('sourcefile'):
        name = src.get('name')
        line_counter = None
        for c in src.findall('counter'):
            if c.get('type') == 'LINE':
                line_counter = c
                break
        if line_counter is None:
            continue
        missed = int(line_counter.get('missed'))
        covered = int(line_counter.get('covered'))
        total = missed + covered
        pct = (covered / total * 100) if total>0 else 100.0
        file_path = f"{pkgname.replace('/', '.')}.{name}" if pkgname else name
        lines.append(f"| {file_path} | {covered} | {missed} | {pct:.2f}% |")

Path(OUT).write_text('\n'.join(lines))
print('Wrote', OUT)
PY

    - name: Comment coverage on PR
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const path = 'coverage-report.md';
          if (!fs.existsSync(path)) {
            console.log('coverage-report.md not found, skipping PR comment');
            return;
          }
          const md = fs.readFileSync(path, 'utf8');
          const preview = md.split('\n').slice(0, 60).join('\n');
          const body = `### JaCoCo Coverage Report (summary)\n\n${preview}\n\n(Full report attached as artifact)`;
          const prNumber = context.payload.pull_request.number;
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: body,
          });

    - name: Commit coverage report
      if: ${{ github.actor != 'github-actions[bot]' }}
      env:
        GIT_AUTHOR_NAME: Bhagyashree
        GIT_AUTHOR_EMAIL: cvbhagyapatil@gmail.com
      run: |
        git config user.name "$GIT_AUTHOR_NAME"
        git config user.email "$GIT_AUTHOR_EMAIL"
        git add coverage-report.md || true
        git commit -m "ci: update coverage report" || echo "no changes to commit"
        git push origin HEAD:feature-1 || echo "push failed"

